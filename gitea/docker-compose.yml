networks:
  gitea:
    external: false

volumes:
  gitea:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

services:
  server:
    image: docker.gitea.com/gitea:1.27.3
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=${GITEA__database__DB_TYPE:?GITEA__database__DB_TYPE}
      - GITEA__database__HOST=${GITEA__database__HOST:?GITEA__database__HOST}
      - GITEA__database__NAME=${GITEA__database__NAME:?GITEA__database__NAME}
      - GITEA__database__USER=${GITEA__database__USER:?GITEA__database__USER}
      - GITEA__database__PASSWD=${GITEA__database__PASSWD:?GITEA__database__PASSWD}
      - GITEA__server__DOMAIN=${GITEA__server__DOMAIN:?GITEA__server__DOMAIN}
      - GITEA__server__SSH_DOMAIN=${GITEA__server__SSH_DOMAIN:?GITEA__server__SSH_DOMAIN}
      - GITEA__server__ROOT_URL=${GITEA__server__ROOT_URL:?GITEA__server__ROOT_URL}
      - GITEA__server__SSH_PORT=${GITEA__server__SSH_PORT:?GITEA__server__SSH_PORT}
      - GITEA__server__SSH_LISTEN_PORT=${GITEA__server__SSH_LISTEN_PORT:?GITEA__server__SSH_LISTEN_PORT}
      - GITEA__service__DISABLE_REGISTRATION=${GITEA__service__DISABLE_REGISTRATION:?GITEA__service__DISABLE_REGISTRATION}
    restart: always
    mem_limit: 1g
    mem_reservation: 512m
    memswap_limit: 1536m
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - gitea
    volumes:
      - gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "222:22"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: docker.io/library/postgres:17
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    restart: always
    mem_limit: 1g
    mem_reservation: 512m
    memswap_limit: 1536m
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB}
    networks:
      - gitea
    volumes:
      - ./postgres:/var/lib/postgresql/data
  caddy:
    image: caddy:2
    restart: always
    mem_limit: 256m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - gitea

  runner:
    image: docker.io/gitea/runner:3
    restart: always
    environment:
      CONFIG_FILE: /config.yaml
      GITEA_INSTANCE_URL: "${GITEA_INSTANCE_URL:?GITEA_INSTANCE_URL}"
      GITEA_RUNNER_REGISTRATION_TOKEN: "${GITEA_RUNNER_REGISTRATION_TOKEN:?GITEA_RUNNER_REGISTRATION_TOKEN}"
      GITEA_RUNNER_NAME: "${GITEA_RUNNER_NAME:?GITEA_RUNNER_NAME}"
      GITEA_RUNNER_LABELS: "${GITEA_RUNNER_LABELS:?GITEA_RUNNER_LABELS}"
    volumes:
      - ./config.yaml:/config.yaml
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      server:
        condition: service_started
